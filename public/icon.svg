<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833" />
      <stop offset="100%" stop-color="#002147" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#C49E3A" />
      <stop offset="100%" stop-color="#9A7B20" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b5c" />
      <stop offset="100%" stop-color="#001a38" />
    </linearGradient>
  </defs>

  <!-- Outer background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Center Logo Tile -->
  <g transform="translate(136, 120)">
    <rect width="240" height="240" rx="60" fill="url(#tileGrad)" stroke="url(#goldGrad)" stroke-width="8" />
    <!-- Letter B with Serif / Elegant Academy styling -->
    <text x="120" y="172" font-family="'Liberation Serif', 'Georgia', serif" font-weight="900" font-size="160" fill="#FFFFFF" text-anchor="middle">B</text>
  </g>

  <!-- Accent stars/dots -->
  <circle cx="256" cy="405" r="7" fill="#C49E3A" />
  <circle cx="230" cy="405" r="4" fill="#C49E3A" opacity="0.6" />
  <circle cx="282" cy="405" r="4" fill="#C49E3A" opacity="0.6" />

  <!-- Arabic Branding -->
  <text x="256" y="445" font-family="'KacstTitle', 'KacstBook', sans-serif" font-weight="bold" font-size="30" fill="#E5C76B" text-anchor="middle">أكاديمية باسم الخليل</text>
</svg>